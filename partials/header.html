<!--
  Shared header — canonical source. Every page wraps its header region in
  PARTIAL:HEADER start/end comment markers (see index.html for the exact
  form); scripts/build.py overwrites everything between those markers with
  this file's contents. Edit here, then run `python3 scripts/build.py` —
  never hand-edit a page's header region directly, it'll just get
  overwritten.

  Nav currently points at in-page anchors (#services, #about, etc.) because
  the site is still one page (Phase 0). Adding a nav entry for a new page
  or section is always a manual edit to this file, and always waits for
  Josh's OK first — build.py never adds nav links on its own.
-->
