name: Site checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify scripts/build.py was run before this push
        run: python3 scripts/build.py --check

  link-and-contrast-checks:
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check links and URL shape
        run: python3 scripts/check_links.py
      - name: Check SEO metadata
        run: python3 scripts/check_seo.py
      - name: Check color contrast
        run: python3 scripts/check_contrast.py

  lighthouse:
    runs-on: ubuntu-latest
    needs: link-and-contrast-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Determine URLs to test
        id: urls
        run: |
          {
            echo "urls<<EOF"
            python3 scripts/ci_lighthouse_urls.py
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Build with Jekyll
        # Lighthouse must test what GitHub Pages actually publishes, not
        # the raw repo — _config.yml's Jekyll `exclude:` list keeps
        # CLAUDE.md/scripts/partials off the live site, so build _site/
        # here the same way Pages does and point Lighthouse at that,
        # not at the repo root (which still has raw, unfilled templates).
        run: |
          gem install jekyll
          jekyll build --source . --destination _site
      # TODO: once the Phase 1 redesign ships, flip categories:performance
      # in .lighthouserc.json from "warn" to "error" — see CLAUDE.md.
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.urls.outputs.urls }}
          configPath: ./.lighthouserc.json

  indexnow:
    runs-on: ubuntu-latest
    needs: [link-and-contrast-checks, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Submit sitemap URLs to IndexNow
        run: python3 scripts/ci_indexnow_submit.py
