name: Site checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  link-and-contrast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check links
        run: python3 scripts/check_links.py

      - name: Check color contrast
        run: python3 scripts/check_contrast.py
